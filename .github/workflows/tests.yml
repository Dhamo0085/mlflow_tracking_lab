name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=Mlflow_Labs/Lab1 --cov-report=term-missing

      - name: End-to-end smoke run (train, sweep, predict)
        working-directory: Mlflow_Labs/Lab1
        run: |
          python linear_regression.py 0.5 0.5
          python sweep.py --alphas 0.01 0.1 --l1-ratios 0.1 0.5
          python predict.py data/sample_wines.csv
